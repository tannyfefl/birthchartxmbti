<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบหลังบ้าน - รายชื่อผู้ลงทะเบียน</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #737373;
      --border: #ebe7e0;
      --hover: #f5f2ed;
      --accent: #e85d3c;
      --accent-hover: #d44a2a;
      --danger: #c1432b;
    }
    body {
      font-family: -apple-system, "Inter", "Sukhumvit Set", "Noto Sans Thai", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .title-block { display: flex; align-items: center; gap: 12px; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .count {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
      margin-left: 22px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .btn {
      padding: 9px 14px;
      font-size: 13.5px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    button:hover { background: var(--hover); }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.danger {
      color: var(--danger);
      border-color: var(--border);
    }
    button.danger:hover { background: #fdf3f0; border-color: #f0c9c0; }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search {
      flex: 1;
      position: relative;
    }
    .search input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(232, 93, 60, 0.12);
    }
    .search svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--hover); }
    .name { font-weight: 500; }
    .muted { color: var(--muted); font-size: 13px; }
    .row-action {
      padding: 5px 10px;
      font-size: 12.5px;
      border-radius: 6px;
      color: var(--danger);
      background: transparent;
      border: 1px solid transparent;
    }
    .row-action:hover {
      background: #fdf3f0;
      border-color: #f0c9c0;
    }
    a.link {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px dashed var(--border);
    }
    a.link:hover { border-bottom-color: var(--accent); color: var(--accent); }

    .empty {
      padding: 64px 24px;
      text-align: center;
      color: var(--muted);
    }
    .empty .big { font-size: 16px; color: var(--text); font-weight: 500; margin-bottom: 6px; }
    .empty a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .empty a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      th:nth-child(4), td:nth-child(4) { display: none; }
      td, th { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title-block">
          <div class="dot"></div>
          <h1>รายชื่อผู้ลงทะเบียน</h1>
        </div>
        <div class="count" id="count">0 รายการ</div>
      </div>
      <div class="actions">
        <a class="btn" href="contact-form.html">+ เพิ่มข้อมูล</a>
        <button id="exportBtn">ดาวน์โหลด CSV</button>
        <button class="danger" id="clearBtn">ล้างทั้งหมด</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อ, เบอร์, หรืออีเมล..." />
      </div>
    </div>

    <div class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th style="width: 32px;">#</th>
            <th>ชื่อ - นามสกุล</th>
            <th>เบอร์โทร</th>
            <th>อีเมล</th>
            <th>ลงทะเบียนเมื่อ</th>
            <th style="width: 80px;"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display: none;">
        <div class="big">ยังไม่มีข้อมูลผู้ลงทะเบียน</div>
        <div>เพิ่มข้อมูลผ่าน <a href="contact-form.html">แบบฟอร์ม</a> ได้เลย</div>
      </div>
    </div>
  </div>

  <script>
    const KEY = 'submissions';
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const searchInput = document.getElementById('searchInput');

    function load() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || '[]');
      } catch {
        return [];
      }
    }

    function save(list) {
      localStorage.setItem(KEY, JSON.stringify(list));
    }

    function formatDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function render() {
      const all = load();
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q
        ? all.filter(r =>
            (r.name || '').toLowerCase().includes(q) ||
            (r.phone || '').toLowerCase().includes(q) ||
            (r.email || '').toLowerCase().includes(q)
          )
        : all;

      countEl.textContent = q
        ? `${filtered.length} จาก ${all.length} รายการ`
        : `${all.length} รายการ`;

      if (all.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 32px; color: var(--muted);">ไม่พบข้อมูลที่ตรงกับ "${escapeHtml(q)}"</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((r, i) => {
        const origIndex = all.indexOf(r);
        return `
          <tr>
            <td class="muted">${i + 1}</td>
            <td class="name">${escapeHtml(r.name)}</td>
            <td><a class="link" href="tel:${escapeHtml(r.phone)}">${escapeHtml(r.phone)}</a></td>
            <td><a class="link" href="mailto:${escapeHtml(r.email)}">${escapeHtml(r.email)}</a></td>
            <td class="muted">${formatDate(r.submittedAt)}</td>
            <td><button class="row-action" data-idx="${origIndex}">ลบ</button></td>
          </tr>
        `;
      }).join('');
    }

    tbody.addEventListener('click', e => {
      const btn = e.target.closest('.row-action');
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      const list = load();
      const item = list[idx];
      if (!item) return;
      if (!confirm(`ลบข้อมูลของ "${item.name}" ใช่ไหม?`)) return;
      list.splice(idx, 1);
      save(list);
      render();
    });

    searchInput.addEventListener('input', render);

    document.getElementById('clearBtn').addEventListener('click', () => {
      const list = load();
      if (list.length === 0) return;
      if (!confirm(`ลบข้อมูลทั้งหมด ${list.length} รายการ ใช่ไหม? (ไม่สามารถกู้คืนได้)`)) return;
      save([]);
      render();
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const list = load();
      if (list.length === 0) {
        alert('ยังไม่มีข้อมูลให้ดาวน์โหลด');
        return;
      }
      const headers = ['ชื่อ-นามสกุล', 'เบอร์โทร', 'อีเมล', 'ลงทะเบียนเมื่อ'];
      const rows = list.map(r => [r.name, r.phone, r.email, formatDate(r.submittedAt)]);
      const csv = [headers, ...rows]
        .map(row => row.map(cell => {
          const s = String(cell ?? '');
          return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        }).join(','))
        .join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `registrations-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    window.addEventListener('storage', e => {
      if (e.key === KEY) render();
    });

    render();
  </script>
</body>
</html>
